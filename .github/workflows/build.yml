name: Build AI Studio APK Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Android Projesini Olustur
        run: |
          mkdir -p app/src/main/java/com/cengiz718/apkuetici

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AIStudioAPKUretici"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.cengiz718.apkuetici"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.cengiz718.apkuetici"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="AI Studio APK Üretici"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/cengiz718/apkuetici/MainActivity.kt
          package com.cengiz718.apkuetici

          import android.annotation.SuppressLint
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Build
          import androidx.compose.material.icons.filled.Code
          import androidx.compose.material.icons.filled.ContentCopy
          import androidx.compose.material.icons.filled.Delete
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.Send
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material.icons.filled.Upload
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit

          data class ChatMessage(val role: String, val content: String)

          class NativeBridge(private val context: Context) {
              @JavascriptInterface
              fun toast(msg: String) {
                  (context as? ComponentActivity)?.runOnUiThread {
                      Toast.makeText(context, msg, Toast.LENGTH_SHORT).show()
                  }
              }

              @JavascriptInterface
              fun copyText(text: String) {
                  (context as? ComponentActivity)?.runOnUiThread {
                      val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("Kopyalanan", text))
                      Toast.makeText(context, "Panoya kopyalandı", Toast.LENGTH_SHORT).show()
                  }
              }

              @JavascriptInterface
              fun shareText(text: String) {
                  (context as? ComponentActivity)?.runOnUiThread {
                      val intent = Intent(Intent.ACTION_SEND).apply {
                          type = "text/plain"
                          putExtra(Intent.EXTRA_TEXT, text)
                      }
                      context.startActivity(Intent.createChooser(intent, "Paylaş"))
                  }
              }
          }

          object BuiltInTemplates {
              fun ecommerceTemplate(): String = """
                  <!DOCTYPE html>
                  <html lang="tr">
                  <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <style>
                      body { font-family: sans-serif; margin:0; background:#0f172a; color:#f8fafc; padding:14px; }
                      .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
                      .badge { background:#2563eb; padding:6px 12px; border-radius:999px; font-size:12px; font-weight:bold; }
                      input { width:100%; box-sizing:border-box; padding:10px; margin-bottom:12px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:#fff; }
                      .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
                      .card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:12px; }
                      .price { color:#38bdf8; font-weight:bold; margin:6px 0; }
                      button { width:100%; border:none; border-radius:8px; padding:9px; background:#2563eb; color:#fff; font-weight:bold; cursor:pointer; }
                      .wa { background:#16a34a; margin-top:14px; padding:12px; font-size:15px; }
                    </style>
                  </head>
                  <body>
                    <div class="top">
                      <h3 style="margin:0;">Katalog & Sipariş</h3>
                      <span class="badge" id="cartCount">Sepet: 0</span>
                    </div>
                    <input id="searchBox" placeholder="Ürün ara..." oninput="render()" />
                    <div class="grid" id="productList"></div>
                    <button class="wa" onclick="sendWhatsApp()">WhatsApp ile Sipariş Gönder</button>
                    <script>
                      const products = [
                        { id:1, name:"Ürün Paketi A", price:450 },
                        { id:2, name:"Ürün Paketi B", price:750 },
                        { id:3, name:"Ekipman Seti", price:1200 },
                        { id:4, name:"Aksesuar Seti", price:320 }
                      ];
                      let cart = JSON.parse(localStorage.getItem("cart_items") || "[]");
                      function render() {
                        const q = (document.getElementById("searchBox").value || "").toLowerCase();
                        document.getElementById("cartCount").innerText = "Sepet: " + cart.length;
                        localStorage.setItem("cart_items", JSON.stringify(cart));
                        const filtered = products.filter(p => p.name.toLowerCase().includes(q));
                        document.getElementById("productList").innerHTML = filtered.map(p =>
                          `<div class="card"><div><b>${p.name}</b></div><div class="price">${p.price} TL</div><button onclick="addItem(${p.id})">Sepete Ekle</button></div>`
                        ).join("");
                      }
                      function addItem(id) {
                        const item = products.find(x => x.id === id);
                        cart.push(item);
                        render();
                        if (window.AndroidBridge) window.AndroidBridge.toast(item.name + " sepete eklendi");
                      }
                      function sendWhatsApp() {
                        if (!cart.length) { alert("Sepet boş"); return; }
                        const total = cart.reduce((a,b)=>a+b.price,0);
                        const lines = cart.map(x=>"- " + x.name + " (" + x.price + " TL)").join("\n");
                        const msg = encodeURIComponent("Yeni Sipariş:\n" + lines + "\nToplam: " + total + " TL");
                        window.open("https://wa.me/?text=" + msg, "_blank");
                      }
                      render();
                    </script>
                  </body>
                  </html>
              """.trimIndent()

              fun orderTrackerTemplate(): String = """
                  <!DOCTYPE html>
                  <html lang="tr">
                  <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <style>
                      body { font-family: sans-serif; margin:0; background:#0f172a; color:#f8fafc; padding:14px; }
                      input, select, button { width:100%; box-sizing:border-box; padding:10px; margin-bottom:8px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#fff; }
                      button { background:#2563eb; border:none; font-weight:bold; cursor:pointer; }
                      .order { background:#1e293b; border-left:4px solid #38bdf8; padding:10px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
                    </style>
                  </head>
                  <body>
                    <h3 style="margin-top:0;">Sipariş & Stok Takip</h3>
                    <input id="custName" placeholder="Müşteri / Ürün Adı" />
                    <input id="orderNote" placeholder="Adet / Tutar / Not" />
                    <select id="orderStatus">
                      <option value="Hazırlanıyor">Hazırlanıyor</option>
                      <option value="Kargoda">Kargoda</option>
                      <option value="Teslim Edildi">Teslim Edildi</option>
                    </select>
                    <button onclick="addOrder()">Kayıt Ekle</button>
                    <div id="ordersList"></div>
                    <script>
                      let orders = JSON.parse(localStorage.getItem("orders_db") || "[]");
                      function saveAndRender() {
                        localStorage.setItem("orders_db", JSON.stringify(orders));
                        document.getElementById("ordersList").innerHTML = orders.map((o, idx) =>
                          `<div class="order"><div><b>${o.name}</b><br><small>${o.note} • ${o.status}</small></div><button style="width:auto;background:#dc2626;" onclick="delOrder(${idx})">Sil</button></div>`
                        ).join("");
                      }
                      function addOrder() {
                        const name = document.getElementById("custName").value.trim();
                        const note = document.getElementById("orderNote").value.trim();
                        const status = document.getElementById("orderStatus").value;
                        if (!name) return;
                        orders.unshift({ name, note, status });
                        document.getElementById("custName").value = "";
                        document.getElementById("orderNote").value = "";
                        saveAndRender();
