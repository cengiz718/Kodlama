                                          Text("Sil")
                                      }}
                                  }}

                                  Button(
                                      onClick = {{
                                          prefs.edit()
                                              .putString("gh_token", ghToken.trim())
                                              .putString("gh_owner", ghOwner.trim())
                                              .putString("gh_repo", ghRepo.trim())
                                              .putString("gh_branch", ghBranch.trim())
                                              .apply()
