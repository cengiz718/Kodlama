          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Build
          import androidx.compose.material.icons.filled.Code
          import androidx.compose.material.icons.filled.ContentCopy
          import androidx.compose.material.icons.filled.Delete
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material.icons.filled.Send
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material.icons.filled.Upload
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit

          data class ChatMessage(val role: String, val content: String)

          class NativeBridge(private val context: Context) {{
              @JavascriptInterface
              fun toast(msg: String) {{
                  (context as? ComponentActivity)?.runOnUiThread {{
                      Toast.makeText(context, msg, Toast.LENGTH_SHORT).show()
                  }}
              }}

              @JavascriptInterface
              fun copyText(text: String) {{
                  (context as? ComponentActivity)?.runOnUiThread {{
                      val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("Kopyalanan", text))
                      Toast.makeText(context, "Panoya kopyalandı", Toast.LENGTH_SHORT).show()
                  }}
              }}

              @JavascriptInterface
              fun shareText(text: String) {{
                  (context as? ComponentActivity)?.runOnUiThread {{
                      val intent = Intent(Intent.ACTION_SEND).apply {{
                          type = "text/plain"
                          putExtra(Intent.EXTRA_TEXT, text)
                      }}
                      context.startActivity(Intent.createChooser(intent, "Paylaş"))
                  }}
              }}
          }}

          private fun decodeB64(b64: String): String =
              String(Base64.decode(b64, Base64.DEFAULT), Charsets.UTF_8)

          object BuiltInTemplates {{
              fun ecommerceTemplate(): String = decodeB64("{b64_ecom}")
              fun orderTrackerTemplate(): String = decodeB64("{b64_order}")
              fun tvRadioTemplate(): String = decodeB64("{b64_tv}")
          }}

          class MainActivity : ComponentActivity() {{
              override fun onCreate(savedInstanceState: Bundle?) {{
                  super.onCreate(savedInstanceState)
                  setContent {{
                      MaterialTheme(colorScheme = darkColorScheme()) {{
                          AiStudioApkScreen()
                      }}
                  }}
              }}
          }}

          @SuppressLint("SetJavaScriptEnabled")
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun AiStudioApkScreen() {{
              val context = LocalContext.current
              val prefs = remember {{ context.getSharedPreferences("apk_ai_prefs", Context.MODE_PRIVATE) }}
              val scope = rememberCoroutineScope()

              var ghToken by remember {{ mutableStateOf(prefs.getString("gh_token", "") ?: "") }}
              var ghOwner by remember {{ mutableStateOf(prefs.getString("gh_owner", "cengiz718") ?: "cengiz718") }}
              var ghRepo by remember {{ mutableStateOf(prefs.getString("gh_repo", "") ?: "") }}
              var ghBranch by remember {{ mutableStateOf(prefs.getString("gh_branch", "main") ?: "main") }}
              var appTitle by remember {{ mutableStateOf("Yeni Uygulamam") }}
              var deletePathInput by remember {{ mutableStateOf("") }}

              var showSettings by remember {{ mutableStateOf(false) }}
              var activeTab by remember {{ mutableIntStateOf(0) }}
              var previewVersion by remember {{ mutableIntStateOf(0) }}
              var promptInput by remember {{ mutableStateOf("") }}
              var isLoading by remember {{ mutableStateOf(false) }}

              var liveHtmlCode by remember {{ mutableStateOf(BuiltInTemplates.ecommerceTemplate()) }}

              val messages = remember {{
                  mutableStateListOf(
                      ChatMessage(
                          "assistant",
                          "AI Studio APK Üretici v5.0 hazır! Anahtarsız yapay zeka ile uygulama üret, 'Canlı Önizleme' sekmesinde test et ve tek tuşla GitHub'a yazıp APK + Release olarak derlet."
                      )
                  )
              }}

              Scaffold(
                  topBar = {{
                      Column(modifier = Modifier.background(Color(0xFF1E293B))) {{
                          TopAppBar(
                              title = {{
                                  Column {{
                                      Text("AI Studio APK Üretici", fontWeight = FontWeight.Bold, fontSize = 17.sp)
                                      Text(
                                          if (ghRepo.isNotBlank()) "Anahtarsız AI • $ghOwner/$ghRepo" else "Anahtarsız AI • Canlı Önizleme",
                                          fontSize = 11.sp,
                                          color = Color(0xFF94A3B8)
                                      )
                                  }}
                              }},
                              actions = {{
                                  IconButton(onClick = {{
                                      if (ghToken.isBlank() || ghRepo.isBlank() || isLoading) {{
                                          showSettings = true
                                          return@IconButton
                                      }}
                                      isLoading = true
                                      scope.launch {{
                                          val status = checkLatestRelease(ghToken.trim(), ghOwner.trim(), ghRepo.trim())
                                          messages.add(ChatMessage("assistant", status))
                                          activeTab = 0
                                          isLoading = false
                                      }}
                                  }}) {{
                                      Icon(Icons.Default.Build, contentDescription = "APK Durumu")
                                  }}
                                  IconButton(onClick = {{ showSettings = !showSettings }}) {{
                                      Icon(Icons.Default.Settings, contentDescription = "Ayarlar")
                                  }}
                              }}
                          )
                          TabRow(
                              selectedTabIndex = activeTab,
                              containerColor = Color(0xFF1E293B),
                              contentColor = Color(0xFF38BDF8)
                          ) {{
                              Tab(
                                  selected = activeTab == 0,
                                  onClick = {{ activeTab = 0 }},
                                  text = {{ Text("Şablon & Sohbet") }},
                                  icon = {{ Icon(Icons.Default.Code, contentDescription = null, modifier = Modifier.size(18.dp)) }}
                              )
                              Tab(
                                  selected = activeTab == 1,
                                  onClick = {{ activeTab = 1 }},
                                  text = {{ Text("Canlı Önizleme") }},
                                  icon = {{ Icon(Icons.Default.PlayArrow, contentDescription = null, modifier = Modifier.size(18.dp)) }}
                              )
                          }}
                      }}
                  }}
              ) {{ padding ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(padding)
                          .background(Color(0xFF0F172A))
                  ) {{
                      if (showSettings) {{
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(10.dp),
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF1E293B))
                          ) {{
                              Column(modifier = Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {{
                                  Text("GitHub Otomasyon Ayarları", fontWeight = FontWeight.Bold, color = Color.White)

                                  OutlinedTextField(
                                      value = appTitle,
                                      onValueChange = {{ appTitle = it }},
                                      label = {{ Text("Üretilecek APK Uygulama Adı") }},
                                      singleLine = true,
                                      modifier = Modifier.fillMaxWidth()
                                  )

                                  OutlinedTextField(
                                      value = ghToken,
                                      onValueChange = {{ ghToken = it }},
                                      label = {{ Text("GitHub Token (ghp_...)") }},
                                      visualTransformation = PasswordVisualTransformation(),
                                      singleLine = true,
                                      modifier = Modifier.fillMaxWidth()
                                  )

                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {{
                                      OutlinedTextField(
                                          value = ghOwner,
                                          onValueChange = {{ ghOwner = it }},
                                          label = {{ Text("Kullanıcı") }},
                                          singleLine = true,
                                          modifier = Modifier.weight(1f)
                                      )
                                      OutlinedTextField(
                                          value = ghRepo,
                                          onValueChange = {{ ghRepo = it }},
                                          label = {{ Text("Depo Adı") }},
                                          singleLine = true,
                                          modifier = Modifier.weight(1.3f)
                                      )
                                      OutlinedTextField(
                                          value = ghBranch,
                                          onValueChange = {{ ghBranch = it }},
                                          label = {{ Text("Dal") }},
                                          singleLine = true,
                                          modifier = Modifier.weight(0.8f)
                                      )
                                  }}

                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {{
                                      OutlinedTextField(
                                          value = deletePathInput,
                                          onValueChange = {{ deletePathInput = it }},
                                          label = {{ Text("Silinecek dosya yolu") }},
                                          singleLine = true,
                                          modifier = Modifier.weight(1f)
                                      )
                                      Button(
                                          onClick = {{
                                              if (deletePathInput.isBlank() || ghToken.isBlank() || ghRepo.isBlank() || isLoading) return@Button
                                              val targetPath = deletePathInput.trim()
                                              isLoading = true
                                              scope.launch {{
                                                  val res = deleteFileFromGitHub(ghToken.trim(), ghOwner.trim(), ghRepo.trim(), targetPath, ghBranch.trim())
                                                  messages.add(ChatMessage("assistant", res))
                                                  isLoading = false
                                              }}
                                          }},
                                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFDC2626))
